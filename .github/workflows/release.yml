name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version info
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Release Tag: $TAG"
          echo "📦 App Version: $VERSION"

      - name: Set up code signing keychain
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="build-keychain-pass"
          KEYCHAIN_PATH="build.keychain"

          echo "🔐 Setting up code signing keychain..."

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign

          # Remove the default reconfirm timeout
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" 2>&1 | head -1

          # Verify certificate
          CERT_NAME="${{ secrets.CERTIFICATE_NAME }}"
          if security find-certificate -c "$CERT_NAME" "$KEYCHAIN_PATH"; then
            echo "✅ Certificate imported: $CERT_NAME"
          else
            echo "⚠️  Certificate not found, continuing anyway..."
          fi

          # Clean up
          rm -f certificate.p12

          # Set environment variables for xcodebuild
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          echo "CODE_SIGN_IDENTITY=$CERT_NAME" >> $GITHUB_ENV

      - name: Build application
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.CERTIFICATE_NAME }}
          KEYCHAIN_PATH: build.keychain
        run: |
          echo "🔨 Building Notimanager..."
          VERSION="${{ steps.version.outputs.version }}"

          # Build directly to derived data (no archive/export needed for self-signed certs)
          xcodebuild -project Notimanager.xcodeproj \
            -scheme Notimanager \
            -configuration Release \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

          # Find the built app
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Notimanager.app" -path "*/Release-iphoneos/*" 2>/dev/null | head -1)

          if [ -z "$APP_PATH" ]; then
            # Alternative location for macOS builds
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Notimanager.app" -path "*/Build/Products/Release/*" 2>/dev/null | head -1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ App not found after build"
            exit 1
          fi

          # Copy app to build directory
          mkdir -p build/release
          cp -R "$APP_PATH" build/release/Notimanager.app

          # Re-sign all frameworks and bundles to match the app signature
          echo "🔐 Re-signing frameworks and bundles..."
          find build/release/Notimanager.app -name "*.framework" -o -name "*.bundle" | while read framework; do
            echo "  Re-signing: $framework"
            codesign --force --deep --sign "$CODE_SIGN_IDENTITY" "$framework" 2>/dev/null || true
          done

          # Re-sign the entire app to ensure consistent signature
          echo "🔐 Re-signing entire app..."
          codesign --force --deep --sign "$CODE_SIGN_IDENTITY" build/release/Notimanager.app

          # Verify code signing
          codesign -dv "build/release/Notimanager.app" 2>&1 || true
          echo "✅ App signed successfully"

      - name: Create ZIP archive (for AppUpdater)
        run: |
          echo "📦 Creating ZIP archive..."

          VERSION="${{ steps.version.outputs.version }}"
          APP_PATH="build/release/Notimanager.app"

          # Create ZIP archive with correct naming for AppUpdater
          # AppUpdater expects: {reponame}-{tag}.zip (lowercase)
          # The tag_name from GitHub releases includes the 'v' prefix
          cd build/release
          zip -r -q "../notimanager-v${VERSION}.zip" "Notimanager.app"
          cd ../..

          ZIP_PATH="build/notimanager-v${VERSION}.zip"
          ZIP_SIZE=$(stat -f%z "$ZIP_PATH" 2>/dev/null || stat -c%s "$ZIP_PATH" 2>/dev/null)

          echo "✅ ZIP created: $ZIP_PATH"
          echo "📊 Size: $ZIP_SIZE bytes"

          echo "ZIP_PATH=$ZIP_PATH" >> $GITHUB_ENV
          echo "ZIP_SIZE=$ZIP_SIZE" >> $GITHUB_ENV

      - name: Create DMG
        run: |
          echo "📦 Creating DMG..."

          # Install create-dmg
          npm install --global create-dmg

          # Get version from app
          VERSION="${{ steps.version.outputs.version }}"
          APP_PATH="build/release/Notimanager.app"

          # Create DMG
          create-dmg \
            --no-code-sign \
            "$APP_PATH" \
            build/

          # Find created DMG
          DMG_PATH=$(find build -name "Notimanager*.dmg" -maxdepth 1 | head -1)

          if [ -z "$DMG_PATH" ]; then
            echo "❌ DMG not found"
            exit 1
          fi

          # Rename to consistent naming: Notimanager-{version}.dmg
          mv "$DMG_PATH" "build/Notimanager-${VERSION}.dmg"
          DMG_PATH="build/Notimanager-${VERSION}.dmg"

          # Get file size
          DMG_SIZE=$(stat -f%z "$DMG_PATH" 2>/dev/null || stat -c%s "$DMG_PATH" 2>/dev/null)

          echo "✅ DMG created: $DMG_PATH"
          echo "📊 Size: $DMG_SIZE bytes"

          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_ENV
          echo "DMG_SIZE=$DMG_SIZE" >> $GITHUB_ENV

      - name: Generate changelog
        id: changelog
        run: |
          echo "📋 Generating changelog..."
          VERSION="${{ steps.version.outputs.version }}"

          # Extract current version only from CHANGELOG.md
          if [ -f "docs/CHANGELOG.md" ]; then
            awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{if(!/^## \[$VERSION\]/) flag=0} flag" docs/CHANGELOG.md > release_notes_current.md 2>/dev/null || true

            if [ -s release_notes_current.md ]; then
              echo "✅ Changelog extracted for $VERSION"
              echo "📋 Release Notes:"
              cat release_notes_current.md
            else
              echo "⚠️  No entry found for $VERSION in CHANGELOG.md, using git log..."
              git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD > release_notes_current.md
            fi
          else
            echo "📝 No CHANGELOG.md found, generating from git log..."
            git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD > release_notes_current.md
          fi

          # Create full release notes for GitHub Release
          cat > release_notes_full.md << EOF
          For installation instructions and documentation, please see [the README](https://github.com/abd3lraouf/Notimanager#readme).

          **Note:** This release is signed with a self-signed certificate for CI/CD automation.
          On first launch, you may need to right-click the app and select "Open".

          ---

          EOF

          cat release_notes_current.md >> release_notes_full.md

          # Add full changelog link
          cat >> release_notes_full.md << 'EOF'

          ---
          **Full Changelog**: https://github.com/abd3lraouf/Notimanager/compare/$PREV_TAG...v$VERSION
          EOF

          # Add previous tag for comparison link
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            sed -i '' "s/\$PREV_TAG/$PREV_TAG/g" release_notes_full.md
          else
            sed -i '' 's/\$PREV_TAG/v0.0.0/g' release_notes_full.md
          fi

          sed -i '' "s/\$VERSION/$VERSION/g" release_notes_full.md

          echo "📋 GitHub Release Notes:"
          cat release_notes_full.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Notimanager ${{ steps.version.outputs.version }}
          body_path: release_notes_full.md
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.DMG_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "🎉 Release created successfully!"
          echo ""
          echo "📦 Version: ${{ steps.version.outputs.version }}"
          echo "📁 ZIP: ${{ env.ZIP_PATH }} (${{ env.ZIP_SIZE }} bytes) - For AppUpdater"
          echo "📁 DMG: ${{ env.DMG_PATH }} (${{ env.DMG_SIZE }} bytes) - For direct download"
          echo ""
          echo "🔐 Code signing: Self-signed (CI certificate)"
          echo "📋 Release: https://github.com/abd3lraouf/Notimanager/releases/tag/${{ steps.version.outputs.tag }}"
